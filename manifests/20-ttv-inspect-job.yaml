# Runs OpenObserve's own `ttv-inspect` CLI against an index file on the live data volume.
# The image is distroless, so a Job on the same volume is the clean way to run the CLI.
# Two placeholders are filled at apply time (see README step 5):
#   NODE_NAME  the node the OpenObserve pod runs on (a local-path volume only exists there)
#   TTV_PATH   the index file to inspect, under /data/stream/
apiVersion: batch/v1
kind: Job
metadata:
  name: ttv-inspect
  namespace: openobserve
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: NODE_NAME
      securityContext:
        runAsUser: 10000
        runAsGroup: 3000
        fsGroup: 2000
      containers:
        - name: inspect
          image: public.ecr.aws/zinclabs/openobserve:v1.0.0-rc1
          command: ["/openobserve", "ttv-inspect", "-f", "TTV_PATH"]
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-o2-openobserve-standalone-0
